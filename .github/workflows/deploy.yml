name: Deploy to GitHub Pages

# -----------------------------------------------------------------------------
# Workflow que builda o projeto Vite/React + TypeScript e publica em GitHub
# Pages a cada push na branch `main` (também acionável manualmente).
#
# Como funciona:
#   1. Faz checkout do repositório
#   2. Instala Node 20 e dependências
#   3. Roda `npm run build` com VITE_BASE_PATH = /<nome-do-repo>/
#   4. Sobe o conteúdo de `dist/` como artifact de Pages
#   5. Job `deploy` publica o artifact no ambiente "github-pages"
# -----------------------------------------------------------------------------

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        env:
          # Injeta o subdiretório do GitHub Pages automaticamente.
          # Resulta em algo como "/copa-2026-simulador/".
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Habilita o GitHub Pages automaticamente caso o repositório
          # ainda não tenha esse recurso ativado (evita "Get Pages site failed").
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
